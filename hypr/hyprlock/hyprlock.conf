# Підключення автогенерованих скриптом кольорів + шляху до шпалери
source = ~/.config/hypr/hyprlock-colors.conf

# --- ЗАГАЛЬНІ НАЛАШТУВАННЯ ---
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
    immediate_render = true
}

# --- АНІМАЦІЇ ---
animations {
    enabled = true
    
    # Плавні криві Безьє для Material-подібного відгуку
    bezier = linear, 1, 1, 0, 0
    bezier = overshot, 0.05, 0.9, 0.1, 1.05
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = easeInOut, 0.42, 0, 0.58, 1

    # Анімація плавної появи екрана блокування та його елементів
    animation = fade, 1, 4, smoothOut
    
    # Анімація зміни кольорів рамки поля вводу (наприклад, при помилці)
    animation = inputFieldColors, 1, 4, easeInOut
    
    # Анімація зміни ширини поля вводу (ефект розширення при фокусі/введенні)
    animation = inputFieldWidth, 1, 4, overshot
}

# --- ФОН ---
background {
    monitor =
    path = $wallpaper_path
    blur_passes = 2
    blur_size = 7
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# --- АВАТАРКА ---
# Аватарка — знизу по центру
image {
    monitor =
    path = ~/.face
    size = 110
    rounding = -1
    border_size = 2
    border_color = $accent_color
    position = 0, 30
    halign = center
    valign = bottom
}

# --- ІМ'Я КОРИСТУВАЧА ---
# Ім'я користувача — над аватаркою
label {
    monitor =
    text = $USER
    font_size = 20
    font_family = $font
    color = $fg_color
    position = 0, 150
    halign = center
    valign = bottom
}

# --- ВВЕДЕННЯ ПАРОЛЯ ---
# Введення пароля (завжди видиме)
input-field {
    monitor =
    size = 250, 60
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true

    outer_color = $accent_color
    inner_color = $bg_color
    font_color = $fg_color
    fail_color = $red_color

    fade_on_empty = false
    rounding = 15
    font_family = $font
    placeholder_text = Input password...
    fail_text = $FAIL
    check_text = Authenticating...
    position = 0, 220
    halign = center
    valign = bottom
}

# --- ГОДИННИК ---
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = $fg_color
    position = -30, -30
    halign = right
    valign = top
}

# --- ДАТА ---
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d %B %Y")"
    font_size = 25
    font_family = $font
    color = $grey_color
    position = -30, -150
    halign = right
    valign = top
}

# --- ПОГОДА ---
# ПОГОДА — зліва
label {
    monitor =
    text = cmd[update:1800000] echo "$(bash ~/.config/hypr/scripts/hyprlock-weather.sh)"
    font_size = 20
    font_family = $font
    color = $accent_color
    position = 30, -30
    halign = left
    valign = top
}

# --- МУЗИЧНИЙ ПЛЕЄР ---
# ЩО ЗАРАЗ ГРАЄ — зліва, з іконкою й повзунком
label {
    monitor =
    # Змінено інтервал оновлення до 1000 (1 сек) для ідеальної плавності повзунка
    text = cmd[update:1000] echo "$(bash ~/.config/hypr/scripts/hyprlock-music.sh)"
    font_size = 16
    font_family = $font
    color = $grey_color
    position = 30, -70
    halign = left
    valign = top
}
