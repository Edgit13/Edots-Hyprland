# modules/binds.conf — mirrors hypr/modules/binds.lua
#
# Programs (binds.lua's locals):
#   terminal=ghostty  fileManager=dolphin  screen=~/.local/bin/rishot
#   screen_rec=hyprscreen  browser=firefox  reboot=reboot
#   lock=hyprlock -c ~/.config/hypr/hyprlock/hyprlock.conf

bind=SUPER,r,reload_config

bind=SUPER,Return,spawn,ghostty
bind=SUPER,Q,killclient
bind=SUPER,U,spawn,~/.local/bin/rishot
bind=SUPER,F3,spawn,systemctl suspend
bind=SUPER,END,spawn,reboot
bind=SUPER,L,spawn,hyprlock -c ~/.config/hypr/hyprlock/hyprlock.conf
bind=SUPER+SHIFT,V,spawn_shell,cliphist list | rofi -dmenu | cliphist decode | wl-copy
bind=SUPER+SHIFT,U,spawn,hyprscreen

bind=SUPER,Space,spawn,qs -c bar ipc call pill toggleLauncher
bind=SUPER,C,spawn,qs -c bar ipc call pill toggleWallpaper
bind=SUPER,V,spawn,qs -c bar ipc call pill toggleClipboard
bind=SUPER,W,spawn,qs -c bar ipc call pill toggleWifi
bind=SUPER,X,spawn,qs -c bar ipc call pill toggleMixer
bind=SUPER,O,spawn,qs -c bar ipc call pill togglePower

bind=SUPER,B,spawn,firefox
bind=SUPER,E,spawn,dolphin
bind=SUPER,F,togglefloating

bind=SUPER,M,spawn_shell,command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || mmsg dispatch quit

bind=SUPER,F1,spawn,~/.config/quickshell/scripts/gamemode.sh
# hl.dsp.window.pseudo() has no mango equivalent (Hyprland dwindle-only) — dropped
bind=SUPER,J,dwindle_toggle_split_direction

# focus movement
bind=SUPER,left,focusdir,left
bind=SUPER,right,focusdir,right
bind=SUPER,up,focusdir,up
bind=SUPER,down,focusdir,down

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

# switch layout
bind=SUPER,n,switch_layout

#dwindle layout(manual split mode)
bind=alt+shift,Return,dwindle_toggle_split_direction

# tag switch / move window to tag
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# scratchpad (closest match to Hyprland's special workspace "magic")
bind=SUPER,S,toggle_scratchpad
bind=SUPER+SHIFT,S,minimized

# scroll through tags
bind=SUPER,mouse_down,viewtoright_have_client
bind=SUPER,mouse_up,viewtoleft_have_client

# move/resize with mod+drag
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# media / brightness keys (bindl = works while screen locked)
bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPause,spawn,playerctl play-pause
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous
