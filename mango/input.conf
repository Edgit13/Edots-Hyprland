# MangoWM input settings

# keyboard
xkb_rules_layout=us,ua
xkb_rules_options=grp:alt_space_toggle
repeat_rate=40
repeat_delay=400
numlockon=1

# trackpad
trackpad_natural_scrolling=1

# mouse
mouse_accel_profile=1
mouse_accel_speed=-0.3

# 3-finger horizontal swipe -> tag switch (was hl.gesture{fingers=3, direction=horizontal, action=workspace})
gesturebind=none,left,3,viewtoleft_have_client
gesturebind=none,right,3,viewtoright_have_client

# per-device override (was hl.device "epic-mouse-v1")
devicerule=name:epic-mouse-v1,accel_speed:-0.5

# input.lua's cursor.no_hardware_cursors=true has no direct mango option — skipped
