# modules/animations.conf — mirrors hypr/modules/animations.lua
# NOTE: animations.lua was never require()'d in the original hyprland.lua,
# so it was likely dead there — sourced here anyway since you want everything.

animations=1
layer_animations=1

# open = subtle zoom-in (Hyprland-popin feel), close = slide out
animation_type_open=zoom
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=fade

# fade
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.4
fadeout_begin_opacity=0.6

# zoom (subtle — 0.85 -> 1.0 instead of the jarring default 0.4 -> 0.8)
zoom_initial_ratio=0.85
zoom_end_ratio=1.0

# durations (ms) — snappy, matched to your old ~150-250ms Hyprland speeds
animation_duration_open=220
animation_duration_close=200
animation_duration_move=250
animation_duration_tag=250
animation_duration_focus=120

# bezier curves: x1,y1,x2,y2 — easeOutQuint-ish for open/move/tag,
# a quick linear-out curve for close, smooth ease for focus/opacity
animation_curve_open=0.23,1,0.32,1
animation_curve_move=0.23,1,0.32,1
animation_curve_tag=0.23,1,0.32,1
animation_curve_close=0.15,0,0.1,1
animation_curve_focus=0.4,0,0.2,1
animation_curve_opafadein=0.23,1,0.32,1
animation_curve_opafadeout=0.4,0,0.2,1

tag_animation_direction=1
