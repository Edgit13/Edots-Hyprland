# MangoWM monitor settings

monitorrule=name:^HDMI-A-1$,scale:1,x:0,y:0

# eDP-1 was "auto-right" of HDMI-A-1 in Hyprland — mango needs an explicit x.
# Set this to HDMI-A-1's real width (run `wlr-randr` to check), 1920 assumed here.
monitorrule=name:^eDP-1$,scale:1,x:1920,y:0

# NOTE: unlike Hyprland workspaces, mango tags (1-9) are per-monitor, not global —
# so the old "workspaces 1-5 on HDMI-A-1, 6-10 on eDP-1" pinning has no direct
# equivalent; each monitor just has its own tags 1-9 now.
